[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "datagent-backend"
version = "0.1.0"
description = "Enterprise governed data analysis agent"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "redis>=5.2,<8",
  "pymilvus>=2.5,<4",
  "sqlglot>=25,<31",
  "openai>=1.60,<3",
  "alembic>=1.14,<2",
  "pyjwt[crypto]>=2.10,<3",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q -rs"
markers = [
  "postgres: requires the configured PostgreSQL; runs in an isolated throwaway schema",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are evaluated once by design.
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "app.workspaces.dependencies.require_workspace_permission",
]
